</div>

<div>

          Close

<!-- Detail Specs -->
<div class="grid grid-cols-2 py-5 gap-y-3 font-body-sm text-body-sm text-secondary">
<div>

</div>

</div>

<!-- Pure Typographic Actions -->
<div class="pt-4 flex flex-col gap-space-md">
<button class="w-full text-left py-3 flex items-center justify-between group transition-colors" id="btn-download">

            Download EPUB
            <span class="block w-full h-[1px] bg-primary mt-0.5"></span>
</span>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary" id="drawer-format-tag">Ready to sync</span>
</button>

<div class="bg-primary text-on-primary px-5 py-2.5 shadow-sm text-center">
<span class="font-label-md text-label-md tracking-wider uppercase text-surface">Downloaded to storage</span>
</div>
</div>

<script>
  (function() {
    const searchInput = document.getElementById('book-search');
    const searchLine = document.getElementById('search-line');
    const searchClear = document.getElementById('search-clear-btn');
    const bookCards = document.querySelectorAll('.book-card');
    const emptyState = document.getElementById('empty-state');
    const filterTags = document.querySelectorAll('.filter-tag');

    const drawer = document.getElementById('action-drawer');
    const backdrop = document.getElementById('modal-backdrop');
    const drawerTitle = document.getElementById('drawer-title');
    const drawerSubtitle = document.getElementById('drawer-subtitle');
    const drawerYear = document.getElementById('drawer-year');
    const drawerSize = document.getElementById('drawer-size');
    const drawerDismiss = document.getElementById('drawer-dismiss');
    const btnDownload = document.getElementById('btn-download');
    const btnSample = document.getElementById('btn-sample');
    const toast = document.getElementById('canvas-toast');

    let currentBookData = null;
    let activeFilter = 'all';

    // Focus state hairline reaction
    searchInput.addEventListener('focus', () => {
      searchLine.classList.remove('bg-primary/15');
      searchLine.classList.add('bg-primary');
    });

    searchInput.addEventListener('blur', () => {
      if (!searchInput.value.trim()) {
        searchLine.classList.remove('bg-primary');
        searchLine.classList.add('bg-primary/15');
      }
    });

    // Filtering & Searching Logic
    function applySearchAndFilter() {
      const query = searchInput.value.toLowerCase().trim();
      let visibleCount = 0;

      if (query.length > 0) {
        searchClear.classList.remove('hidden');
      } else {
        searchClear.classList.add('hidden');
      }

      bookCards.forEach(card => {
        const title = card.getAttribute('data-title').toLowerCase();
        const author = card.getAttribute('data-author').toLowerCase();
        const year = card.getAttribute('data-year');
        const cat = card.getAttribute('data-category');

        const matchesQuery = query === '' || title.includes(query) || author.includes(query) || year.includes(query);
        const matchesCat = activeFilter === 'all' || cat === activeFilter;

        if (matchesQuery && matchesCat) {
          card.classList.remove('hidden');
          visibleCount++;
        } else {
          card.classList.add('hidden');
        }
      });

      if (visibleCount === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }
    }

    searchInput.addEventListener('input', applySearchAndFilter);

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      applySearchAndFilter();
      searchInput.focus();
    });

    // Filter Buttons
    filterTags.forEach(btn => {
      btn.addEventListener('click', () => {
        filterTags.forEach(b => {
          b.classList.remove('text-primary');
          b.classList.add('text-secondary');
          const ind = b.querySelector('.tab-indicator');
          if (ind) {
            ind.classList.remove('scale-x-100');
            ind.classList.add('scale-x-0');
          }
        });

        btn.classList.add('text-primary');
        btn.classList.remove('text-secondary');
        const ind = btn.querySelector('.tab-indicator');
        if (ind) {
          ind.classList.remove('scale-x-0');
          ind.classList.add('scale-x-100');
        }

        activeFilter = btn.getAttribute('data-category');
        applySearchAndFilter();
      });
    });

    // Drawer Interaction
    function openDrawer(card) {
      currentBookData = {
        title: card.getAttribute('data-title'),
        author: card.getAttribute('data-author'),
        year: card.getAttribute('data-year'),
        size: card.getAttribute('data-size')
      };

      drawerTitle.textContent = currentBookData.title;
      drawerSubtitle.textContent = currentBookData.author;
      drawerYear.textContent = currentBookData.year;
      drawerSize.textContent = currentBookData.size;

      backdrop.classList.remove('pointer-events-none');
      backdrop.classList.remove('opacity-0');
      backdrop.classList.add('opacity-100');

      drawer.classList.remove('translate-y-full');
      drawer.classList.add('translate-y-0');
    }

    function closeDrawer() {
      backdrop.classList.add('opacity-0');
      backdrop.classList.add('pointer-events-none');
      drawer.classList.add('translate-y-full');
      drawer.classList.remove('translate-y-0');
    }

    bookCards.forEach(card => {
      card.addEventListener('click', () => openDrawer(card));
    });

    backdrop.addEventListener('click', closeDrawer);
    drawerDismiss.addEventListener('click', closeDrawer);

    // Toast feedback & Download Trigger
    let toastTimeout = null;
    function showToast(text) {
      if (text) {
        toast.querySelector('span').textContent = text;
      }
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2400);
    }

    btnDownload.addEventListener('click', () => {
      closeDrawer();
      setTimeout(() => {
        showToast('Downloaded to storage');
      }, 300);
    });

    btnSample.addEventListener('click', () => {
      closeDrawer();
      setTimeout(() => {
        showToast('Sample dispatched');
      }, 300);
    });

  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-2px_12px_rgba(41,18,0,0.03)]" data-active-classes="text-primary-container font-semibold"><div class="flex justify-around items-center h-16 px-margin"><a aria-current="page" class="flex items-center justify-center h-11 px-space-md uppercase tracking-wider transition-colors text-primary-container font-semibold" data-path="discover" href="#">Discover</a><a class="flex items-center justify-center h-11 px-space-md font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-on-surface transition-colors" data-path="catalog" href="#">Catalog</a><a class="flex items-center justify-center h-11 px-space-md font-label-md text-label-md uppercase tracking-wider text-on-surface-variant hover:text-on-surface transition-colors" data-path="shelves" href="#">Shelves</a></div></nav></body></html>
